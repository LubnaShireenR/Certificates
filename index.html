  }

  body {

  .wrap {

  a {

  button {

    color: inherit

  :focus-visible {

  }

  header.top {
    padding-block: 56px 28px;
    display: grid;
    gap: 28px

  .kicker {

    text-transform: uppercase;
    color: var(--muted)
  }

  h1 {

    letter-spacing: -.025em;
    margin: 10px 0 14px;
    text-wrap: balance
  }

  .sub {
    max-width: 60ch;
    color: var(--muted);
    font-size: 17px;
    margin: 0
  }

  .ledger {
    display: flex;
    flex-wrap: wrap;
    gap: 0;
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line)
  }

  .ledger div {
    flex: 1 1 150px;
    padding: 16px 20px 16px 0;
    min-width: 0
  }

  .ledger b {
    display: block;
    font: 600 34px/1.1 var(--f-display);

  }

  .ledger span {

    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--muted)
  }

  .bar {
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    z-index: 5;
    background: var(--bg);
    padding-block: 12px;
    border-bottom: 1px solid var(--line);
    display: grid;
    gap: 10px

  body::before {

  .search {

  .search::placeholder {
    color: var(--muted)

  .chips {

    flex-wrap: wrap;
    gap: 8px
  }

  .chip {
    border: 1px solid var(--line);
    background: transparent;
    border-radius: 999px;
    padding: 6px 12px;
    font: 500 13px/1.2 var(--f-body);
    cursor: pointer;
    color: var(--ink)

  .chip small {
    font: 400 11px var(--f-mono);
    color: var(--muted);
    margin-left: 6px
  }

  .chip:hover {
    border-color: var(--accent)

  .chip[aria-pressed="true"] {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-ink)
  }

  .chip[aria-pressed="true"] small {
    color: inherit;
    opacity: .8

    white-space: nowrap

  .tag.pub {

    border-color: var(--signal)
  }

  .empty {
    padding: 60px 0;
    color: var(--muted);
    text-align: center
  }

    inset: 0;
    z-index: 20;
    background: var(--scrim);

  }

    border: 1px solid var(--line);
    border-radius: 10px;
    width: min(1100px, 100%);
    max-height: 100%;
    overflow: auto;
    display: grid;

    display: flex;
    align-items: center;
    justify-content: center;
    padding: 12px;
    min-width: 0

    max-height: 78vh;
    height: auto;

    display: grid;
    gap: 12px;
    align-content: start;
    min-width: 0

    gap: 8px;
    margin-top: 4px

    background: transparent;
    border-radius: 6px;
    padding: 8px 12px;
    text-decoration: none;
    color: var(--ink);

    margin-top: 6px;
    padding-top: 12px;

    padding-top: 48px;
    color: var(--muted);
    font: 12px var(--f-mono)

4", "coll": "Great Learning Academy", "topic": "AI & ML", "ref": null, "verify": null, "pdf": null }, { "slug": "ds-foundation", "title": "Data Science Foundations", "org": "Great Learning Academy", "platform": "Great Learning", "date": "Apr 2023", "key": "2023-04", "coll": "Great Learning Academy", "topic": "Data & Analytics", "ref": null, "verify": null, "pdf": null }, { "slug": "udemy-sql-for-data-analytics", "title": "SQL for Data Analytics", "org": "Udemy", "platform": "Udemy", "date": "8 Jul 2025", "key": "2025-07-08", "coll": "Other Platforms", "topic": "Data & Analytics", "ref": ["Certificate no", "UC-b8756b93-dd67-4c44-ac7e-317db0ede0a9"], "verify": "https://ude.my/UC-b8756b93-dd67-4c44-ac7e-317db0ede0a9", "pdf": "files/udemy-sql-for-data-analytics.pdf" }, { "slug": "verilog-certificate-linkedin", "title": "Learning Verilog for FPGA Development", "org": "LinkedIn Learning", "platform": "LinkedIn Learning", "date": "1 Oct 2025", "key": "2025-10-01", "coll": "Other Platforms", "topic": "Hardware & Electronics", "ref": ["Certificate ID", "deefe1e334fec57c32107c383d74e7d71fdcaf5e8cab0fc66be018ebf892448a"], "verify": null, "pdf": "files/verilog-certificate-linkedin.pdf" }, { "slug": "intro-to-ds-simplilearn", "title": "Introduction to Data Science", "org": "Simplilearn", "platform": "Simplilearn", "date": "18 Apr 2026", "key": "2026-04-18", "coll": "Other Platforms", "topic": "Data & Analytics", "ref": ["Certificate code", "10121889"], "verify": null, "pdf": "files/intro-to-ds-simplilearn.pdf" }];
  const ORDER = ["Research & Publications", "Hackathons, Workshops & Events", "Job Simulations", "Coursera", "Great Learning Academy", "Other Platforms"];
  const VIA = ["Coursera", "Forage"];
  const via = e => VIA.includes(e.platform);
  const state = { topic: "All", q: "", list: [], idx: -1 };
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  DATA.forEach(e => {
    const t = e.title, o = e.org;
    e.hay = (t + " " + o + " " + e.platform + " " + e.topic + " " + (e.ref ? e.ref[1] : "")).toLowerCase();
  });

  function ledger() {
    const years = DATA.map(e => (e.key || "").slice(0, 4)).filter(Boolean).sort();
    const items = [
      [DATA.length, "Certificates"],
      [DATA.filter(e => e.coll === ORDER[0]).length, "Journal publications"],
      [DATA.filter(e => e.coll === ORDER[2]).length, "Job simulations"],
      [years[0] + "–" + years[years.length - 1], "Years covered"]
    ];
    $("ledger").innerHTML = items.map(([n, l]) => `<div><b>${n}</b><span>${l}</span></div>`).join("");
  }

  function chips() {
    const topics = [...new Set(DATA.map(e => e.topic))].sort((a, b) => DATA.filter(e => e.topic === b).length - DATA.filter(e => e.topic === a).length);
    const all = ["All", ...topics];
    $("chips").innerHTML = all.map(t => {
      const n = t === "All" ? DATA.length : DATA.filter(e => e.topic === t).length;
      return `<button class="chip" type="button" data-t="${esc(t)}" aria-pressed="${t === state.topic}">${esc(t)}<small>${n}</small></button>`;
    }).join("");
  }

  function visible() {
    const q = state.q.trim().toLowerCase();
    return DATA.filter(e => (state.topic === "All" || e.topic === state.topic) && (!q || e.hay.includes(q)));
  }

  function render() {
    const vis = visible();
    state.list = [];
    let html = "";
    ORDER.forEach(c => {
      const items = vis.filter(e => e.coll === c).sort((a, b) => (b.key || "").localeCompare(a.key || ""));
      if (!items.length) return;
      html += `<section class="group"><div class="ghead"><h2>${esc(c)}</h2><span class="n">${items.length} ${items.length === 1 ? "CERTIFICATE" : "CERTIFICATES"}</span></div><div class="grid">`;
      items.forEach(e => {
        const i = state.list.push(e) - 1;
        const plat = via(e) ? " · " + e.platform : "";
        html += `<button class="card" type="button" data-i="${i}">
        <span class="im"><img src="thumbs/${e.slug}.jpg" alt="Certificate: ${esc(e.title)}" loading="lazy" decoding="async"></span>
        <span class="tx"><h3>${esc(e.title)}</h3><span class="org">${esc(e.org)}</span>
        <span class="meta"><span>${esc(e.date)}${esc(plat)}</span></span></span></button>`;
      });
      html += `</div></section>`;
    });
    $("out").innerHTML = html || `<p class="empty">No certificates match that search.</p>`;
    $("foot").textContent = vis.length + " of " + DATA.length + " certificates shown";
  }

  function open(i) {
    const e = state.list[i]; if (!e) return;
    state.idx = i;
    $("vimg").src = "thumbs/" + e.slug + ".jpg"; $("vimg").alt = "Certificate: " + e.title;
    $("vt").textContent = e.title;
    let dl = `<div><dt>Issued by</dt><dd>${esc(e.org)}${via(e) ? " via " + esc(e.platform) : ""}</dd></div>
    <div><dt>Date</dt><dd>${esc(e.date)}</dd></div>
    <div><dt>Topic</dt><dd>${esc(e.topic)}</dd></div>`;
    if (e.ref) dl += `<div><dt>${esc(e.ref[0])}</dt><dd class="mono">${esc(e.ref[1])}</dd></div>`;
    $("vd").innerHTML = dl;
    let a = "";
    if (e.verify) a += `<a class="btn pri" href="${esc(e.verify)}" target="_blank" rel="noopener">Verify credential</a>`;
    a += e.pdf ? `<a class="btn" href="${esc(e.pdf)}" target="_blank" rel="noopener">Open PDF</a>` : `<a class="btn" href="thumbs/${e.slug}.jpg" target="_blank" rel="noopener">Open full image</a>`;
    $("va").innerHTML = a;
    $("viewer").hidden = false;
    $("close").focus();
  }
  function closeV() { $("viewer").hidden = true; const c = document.querySelector(`.card[data-i="${state.idx}"]`); if (c) c.focus(); }
  function step(d) { const n = state.list.length; if (n) open((state.idx + d + n) % n); }

  $("out").addEventListener("click", ev => { const c = ev.target.closest(".card"); if (c) open(+c.dataset.i); });
  $("chips").addEventListener("click", ev => { const b = ev.target.closest(".chip"); if (!b) return; state.topic = b.dataset.t; chips(); render(); });
  $("q").addEventListener("input", ev => { state.q = ev.target.value; render(); });
  $("close").addEventListener("click", closeV);
  $("prev").addEventListener("click", () => step(-1));
  $("next").addEventListener("click", () => step(1));
  $("viewer").addEventListener("click", ev => { if (ev.target.id === "viewer") closeV(); });
  document.addEventListener("keydown", ev => {
    if ($("viewer").hidden) return;
    if (ev.key === "Escape") closeV();
    if (ev.key === "ArrowLeft") step(-1);
    if (ev.key === "ArrowRight") step(1);
  });

  ledger(); chips(); render();
</script>
